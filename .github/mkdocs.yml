site_name: PSPD – Projeto de Pesquisa
site_url: https://pspd-grupo.github.io/Projeto-de-Pesquisa/
repo_url: https://github.com/PSPD-Grupo/Projeto-de-Pesquisa
repo_name: PSPD-Grupo/Projeto-de-Pesquisa

theme:
  name: material
  language: pt
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Modo escuro
  font:
    text: Fira Sans
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes

nav:
  - Início: index.md
  - gRPC:
      - Visão Geral: grpc/index.md
      - Protobuf: grpc/protobuf.md
      - HTTP/2: grpc/http2.md
      - Tipos de Comunicação: grpc/tipos-comunicacao.md
      - Exemplos e Testes: grpc/exemplos.md
  - Microsserviços (Diário):
      - Nossa Aplicação: microsservicos/index.md
      - Arquitetura: microsservicos/arquitetura.md
      - Funcionalidades Planejadas: microsservicos/diario-desabafo.md
  - Sobre o Grupo: sobre.md
  