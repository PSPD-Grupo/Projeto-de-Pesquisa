apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stub-api
  template:
    metadata:
      labels:
        app: stub-api
    spec:
      containers:
      - name: stub-api
        image: stub-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000

        env:
        - name: SERVIDOR_A_HOST
          value: "servidor-a:50051"

        - name: SERVIDOR_B_HOST
          value: "servidor-b:50052"

---
apiVersion: v1
kind: Service
metadata:
  name: stub-api
spec:
  type: NodePort
  selector:
    app: stub-api
  ports:
  - port: 8000
    targetPort: 8000